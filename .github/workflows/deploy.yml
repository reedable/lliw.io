name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: `pages` to publish, `id-token` for the OIDC
# token it exchanges with the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is false so an in-flight deploy is
# allowed to finish rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respects package-lock.json exactly, and runs the postinstall that
      # copies the icon fonts into src/fonts — the build needs them present.
      - run: npm ci

      # Runs typecheck first (see the "build" script), so a type error fails the
      # deploy rather than shipping.
      - run: npm run build

      - uses: actions/configure-pages@v5

      # outDir in vite.config.ts is www/, not dist/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
